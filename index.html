</style></head><body><header><div class="top"><div class="brand">HOM.LEAGUE 3rd season<small>LIVE DATA DASHBOARD <span id="status" class="status">● 接続中</span> <button id="refresh" class="refresh" style="padding:3px 7px;font-size:10px">更新</button></small></div><div class="tabs"><button class="tab active" data-p="teams">チーム順位</button><button class="tab" data-p="individual">個人成績</button><button class="tab" data-p="match">試合スタッツ</button></div></div></header><main>

const PUB='2PACX-1vR5zf2HvJGhj2EXRquM5qMdypZpoALCTsZsOpg4O_mU-DbYUIvJWMlrksOVAcK7UwaO0AZxBS-SRLob',G={match:1001379806,hand:393211329,set:970206959},URL=k=>`https://docs.google.com/spreadsheets/d/e/${PUB}/pub?gid=${G[k]}&single=true&output=csv`;const teams=['ツキMAKURI','ストラスギア','絆','Resurge','Mavericks','The Unstoppables','Undefeated Victors','ブライト・イグニッション'];let colors={'ツキMAKURI':'#AD00FF','ストラスギア':'#0038FF','絆':'#007E66','Resurge':'#FFC519','Mavericks':'#D9D9D9','The Unstoppables':'#FF3131','Undefeated Victors':'#8497FE','ブライト・イグニッション':'#FF741F'},D=null;
function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i];if(q){if(x==='"'&&t[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=''}else if(x==='\n'){r.push(c.replace(/\r$/,''));a.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a.filter(r=>r.some(x=>x.trim()))}function objs(a){let h=a[0]||[];return a.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }function n(v){let x=Number(String(v||'').replace(/,/g,''));return Number.isFinite(x)?x:0}function key(s,t,g){return `${s}-${t}-${g}`}function mix(hex,a=.62){let h=hex.slice(1),v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));return '#'+v.map(x=>Math.round(x+(255-x)*a).toString(16).padStart(2,'0')).join('')}function esc(s){return String(s??'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[x]||x))}function fmtDate(s){if(!s)return'—';if(/^\d+$/.test(s)&&+s>30000){let d=new Date(Date.UTC(1899,11,30)+(+s)*86400000);return`${d.getUTCMonth()+1}/${d.getUTCDate()}`}let d=new Date(s);return isNaN(d)?s:`${d.getMonth()+1}/${d.getDate()}`}
function nice(range){let rough=range/6,p=10**Math.floor(Math.log10(Math.max(rough,1))),s=[1,2,5,10].map(x=>x*p).find(x=>x>=rough)||10*p;return Math.max(10,s)}function chart(svg,labels,series,extra=[]){svg.innerHTML='';let W=1200,H=560,p={l:96,r:34,t:24,b:78},ns='http://www.w3.org/2000/svg',all=[...series,...extra].flatMap(s=>s.v.filter(Number.isFinite));if(!all.length)return;let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=10;hi+=10}let st=nice(hi-lo),mn=Math.floor(lo/st)*st,mx=Math.ceil(hi/st)*st;if(mn===mx)mx+=st;let x=i=>p.l+i*(W-p.l-p.r)/Math.max(1,labels.length-1),y=v=>p.t+(mx-v)*(H-p.t-p.b)/(mx-mn);for(let v=mn;v<=mx+.0001;v+=st){let yy=y(v),l=document.createElementNS(ns,'line');Object.entries({x1:p.l,x2:W-p.r,y1:yy,y2:yy,stroke:'#2b323b'}).forEach(([k,z])=>l.setAttribute(k,z));svg.appendChild(l);let t=document.createElementNS(ns,'text');Object.entries({x:p.l-16,y:yy+4,'text-anchor':'end',fill:'#818b98','font-size':12}).forEach(([k,z])=>t.setAttribute(k,z));t.textContent=Math.round(v).toLocaleString();svg.appendChild(t)}labels.forEach((z,i)=>{let t=document.createElementNS(ns,'text');Object.entries({x:x(i),y:H-30,'text-anchor':'middle',fill:'#858f9c','font-size':11}).forEach(([k,v])=>t.setAttribute(k,v));t.textContent=z;svg.appendChild(t)});[...series,...extra].forEach(s=>{let q=document.createElementNS(ns,'polyline');q.setAttribute('points',s.v.map((v,i)=>`${x(i)},${y(v)}`).join(' '));q.setAttribute('fill','none');q.setAttribute('stroke',s.c);q.setAttribute('stroke-width',s.w||4);q.setAttribute('stroke-linecap','round');q.setAttribute('stroke-linejoin','round');if(s.d)q.setAttribute('stroke-dasharray',s.d);svg.appendChild(q)})}
function build(M,H,S){S.forEach(r=>{if(teams.includes(r['チーム'])&&/^#[0-9a-fA-F]{6}$/.test(r['カラーコード']||''))colors[r['チーム']]=r['カラーコード']});M=M.filter(r=>r['選手']&&r['チーム']&&n(r['試合番号']));let matches={},gameRows={},tp=Object.fromEntries(teams.map(t=>[t,0])),games=Object.fromEntries(teams.map(t=>[t,new Set()]));M.forEach(r=>{let s=n(r['節']),t=(r['卓']||'').replace('卓',''),g=n(r['試合番号']),k=key(s,t,g);(matches[k]??={s,t,g,date:r['日付'],players:[],labels:[],trends:{},stats:{}}).players.push({name:r['選手'],team:r['チーム'],score:n(r['素点']),rank:n(r['着順']),point:n(r['リーグポイント'])});(gameRows[g]??=[]).push(r);tp[r['チーム']]+=n(r['リーグポイント']);games[r['チーム']].add(g)});let blocks={},cur=null,ck='';H.forEach(r=>{let s=n(r['節']),t=(r['卓']||'').replace('卓',''),g=n(r['試合番号']),k=key(s,t,g);if(!s||!t||!g||!r['選手'])return;if(r['局']){cur={hand:String(r['局']).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)),rows:[]};(blocks[k]??=[]).push(cur);ck=k}else if(ck!==k){cur=null;ck=k}if(cur&&ck===k)cur.rows.push(r)});let names=new Map();M.forEach(r=>names.set(r['選手'],r['チーム']));H.forEach(r=>{if(r['選手']&&r['チーム'])names.set(r['選手'],r['チーム'])});let ind={};names.forEach((team,name)=>ind[name]={name,team,points:0,games:0,hands:0,first:0,fourth:0,highScore:0,riichi:0,agari:0,houju:0,furo:0,winSum:0});M.forEach(r=>{let p=ind[r['選手']];if(!p)return;let rk=n(r['着順']);p.points+=n(r['リーグポイント']);p.games++;p.highScore=Math.max(p.highScore,n(r['素点']));if(rk===1)p.first++;if(rk===4)p.fourth++});Object.entries(blocks).forEach(([k,bs])=>{let m=matches[k];if(!m)return;let pts=Object.fromEntries(m.players.map(p=>[p.name,25000]));m.labels=['開始前'];m.players.forEach(p=>m.trends[p.name]=[25000]);m.stats=Object.fromEntries(m.players.map(p=>[p.name,{riichi:0,agari:0,houju:0}]));let dr=0;bs.forEach(b=>{let draw=false;b.rows.forEach(r=>{let a=r['行動']||'',nm=r['選手'];pts[nm]=(pts[nm]??25000)+n(r['和了点'])-n(r['失点'])+n(r['流局支出'])+n(r['立直棒支出'])+n(r['オーラス立直棒分配']);let st=m.stats[nm],ip=ind[nm];if(a.includes('流局'))draw=true;if(st){if(a.includes('立直'))st.riichi++;if(a.includes('和了'))st.agari++;if(a.includes('放銃'))st.houju++}if(ip){ip.hands++;if(a.includes('立直'))ip.riichi++;if(a.includes('和了')){ip.agari++;ip.winSum+=n(r['和了点'])}if(a.includes('放銃'))ip.houju++;if(a.includes('副露'))ip.furo++}});if(draw)dr++;m.labels.push(b.hand);m.players.forEach(p=>m.trends[p.name].push(pts[p.name]??25000))});m.totalHands=bs.length;m.draws=dr});Object.values(ind).forEach(p=>{p.topRate=p.games?p.first/p.games*100:0;p.avoid4=p.games?(p.games-p.fourth)/p.games*100:0;p.riichiRate=p.hands?p.riichi/p.hands*100:0;p.agariRate=p.hands?p.agari/p.hands*100:0;p.houjuRate=p.hands?p.houju/p.hands*100:0;p.furoRate=p.hands?p.furo/p.hands*100:0;p.avgScore=p.agari?p.winSum/p.agari:0});let tr=Object.fromEntries(teams.map(t=>[t,[0]])),labs=['開始前'],border=[0],run=Object.fromEntries(teams.map(t=>[t,0]));for(let round=1;round<=56;round++){let rs=[...(gameRows[round*2-1]||[]),...(gameRows[round*2]||[])];if(!rs.length)continue;rs.forEach(r=>run[r['チーム']]+=n(r['リーグポイント']));labs.push(`${Math.ceil(round/2)}節`);teams.forEach(t=>tr[t].push(run[t]));border.push(teams.map(t=>run[t]).sort((a,b)=>b-a)[3]||0)}return{matches,ind:Object.values(ind),tp,games:Object.fromEntries(teams.map(t=>[t,games[t].size])),tr,labs,border}}
function band(team,text){let c=colors[team]||'#777';return`<div class="band" style="background:linear-gradient(90deg,${mix(c)},${c},#050505)">${esc(text)}</div>`}function renderTeams(){let a=[...teams].sort((a,b)=>D.tp[b]-D.tp[a]);rank.innerHTML=a.map((t,i)=>`<div class="teamrow ${i<4?'top4':''} ${i===3?'fourth':''}"><div class="rk">${i+1}</div><div class="tband" style="background:linear-gradient(90deg,${mix(colors[t])},${colors[t]} 65%,#050505)">${t}</div><div class="pt">${D.tp[t]>0?'+':''}${D.tp[t].toFixed(1)}<small>${D.games[t]}/56 試合</small></div></div>`).join('');legend.innerHTML=teams.map(t=>`<span><i style="background:${colors[t]}"></i>${t}</span>`).join('');trendBadge.textContent=`${D.labs.length-1} MATCH POINTS`;chart(teamChart,D.labs,teams.map(t=>({v:D.tr[t],c:colors[t]})),[{v:D.border,c:'#fff',w:2,d:'9 8'}])}
const defs={points:['総Pt',0,v=>(v>0?'+':'')+v.toFixed(1)],avgScore:['平均打点',0,v=>v?Math.round(v).toLocaleString():'—'],topRate:['トップ率',0,v=>v.toFixed(1)+'%'],avoid4:['4着回避率',0,v=>v.toFixed(1)+'%'],highScore:['最高スコア',0,v=>Math.round(v).toLocaleString()],riichiRate:['立直率',0,v=>v.toFixed(1)+'%'],agariRate:['和了率',0,v=>v.toFixed(1)+'%'],houjuRate:['放銃率',1,v=>v.toFixed(1)+'%'],furoRate:['副露率',0,v=>v.toFixed(1)+'%']},order=Object.keys(defs);function renderInd(){let k=metric.value,a=[...D.ind].sort((x,y)=>defs[k][1]?(x[k]-y[k]):((y[k]||0)-(x[k]||0))),cols=[k,...order.filter(x=>x!==k)];itable.innerHTML=`<div class="tr hdr"><div>順位</div><div>選手</div><div>チーム</div>${cols.map((x,i)=>`<div class="${i?'':'focus'}">${defs[x][0]}</div>`).join('')}</div>`+a.map((p,i)=>`<div class="tr data"><div class="pos">${i+1}</div>${band(p.team,p.name)}${band(p.team,p.team)}${cols.map((x,j)=>`<div class="num ${j?'':'focus'}">${defs[x][2](p[x]||0)}</div>`).join('')}</div>`).join('')}
function gameNo(s,t,m){return(s-1)*4+(m===1?1:3)+(t==='B'?1:0)}function renderMatch(){let s=+sec.value,t=tbl.value,m=+mno.value,g=gameNo(s,t,m),o=D.matches[key(s,t,g)];mtitle.textContent=`第${s}節 ${t}卓 第${m}試合 持ち点推移`;date.textContent=o?fmtDate(o.date):'—';hands.textContent=o?.totalHands!=null?o.totalHands+'局':'—';draws.textContent=o?.draws!=null?o.draws+'局':'—';mstate.textContent=o?'RESULT INPUT':'未対局';if(!o){mchart.style.display='none';mempty.style.display='block';mempty.textContent='結果データなし';mtable.innerHTML='';return}mempty.style.display='none';mchart.style.display='block';chart(mchart,o.labels,o.players.map(p=>({v:o.trends[p.name],c:colors[p.team]})));mtable.innerHTML=`<div class="tr hdr"><div>順位</div><div>選手</div><div>チーム</div><div>持ち点</div><div>Pt</div><div>立直</div><div>和了</div><div>放銃</div></div>`+[...o.players].sort((a,b)=>a.rank-b.rank).map(p=>{let st=o.stats[p.name]||{};return`<div class="tr data"><div class="pos">${p.rank}</div>${band(p.team,p.name)}${band(p.team,p.team)}<div class="num">${Math.round(p.score).toLocaleString()}</div><div class="num">${p.point>0?'+':''}${p.point.toFixed(1)}</div><div class="num">${st.riichi??'—'}</div><div class="num">${st.agari??'—'}</div><div class="num">${st.houju??'—'}</div></div>`}).join('')}
async function load(){status.textContent='● 更新中';try{let [m,h,s]=await Promise.all(['match','hand','set'].map(async k=>objs(csv(await(await fetch(URL(k),{cache:'no-store'})).text()))));D=build(m,h,s);renderTeams();renderInd();renderMatch();let q=new Date;status.textContent=`● LIVE ${String(q.getHours()).padStart(2,'0')}:${String(q.getMinutes()).padStart(2,'0')}`;note.textContent='データ元：Google Sheets（60秒ごとに自動更新）'}catch(e){console.error(e);status.textContent='● 更新失敗';status.style.color='#ff8a8a'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));document.getElementById(b.dataset.p).classList.remove('hide')});sec.innerHTML=Array.from({length:28},(_,i)=>`<option value="${i+1}">第${i+1}節</option>`).join('');metric.onchange=renderInd;[sec,tbl,mno].forEach(x=>x.onchange=renderMatch);refresh.onclick=load;load();setInterval(load,60000);
