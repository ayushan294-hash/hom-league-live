function gameNo(s,t,m){return(s-1)*4+(m===1?1:3)+(t==='B'?1:0)}function renderMatch(){let s=+sec.value,t=tbl.value,m=+mno.value,g=gameNo(s,t,m),o=D.matches[key(s,t,g)];mtitle.textContent=`第${s}節 ${t}卓 第${m}試合 持ち点推移`;date.textContent=o?fmtDate(o.date):'—';let shownHands=o?(Array.isArray(o.labels)?Math.max(0,o.labels.length-1):o.totalHands):null;hands.textContent=shownHands!=null?shownHands+'局':'—';draws.textContent=o?.draws!=null?o.draws+'局':'—';mstate.textContent=o?'RESULT INPUT':'未対局';if(!o){mchart.style.display='none';mempty.style.display='block';mempty.textContent='結果データなし';mtable.innerHTML='';return}mempty.style.display='none';mchart.style.display='block';let handLabels=o.labels.map((x,i,a)=>i===0?x:(a[i-1]===x?'':x));chart(mchart,handLabels,o.players.map(p=>({v:o.trends[p.name],c:colors[p.team]})));mtable.innerHTML=`<div class="tr hdr"><div>順位</div><div>選手</div><div>チーム</div><div>持ち点</div><div>Pt</div><div>立直</div><div>和了</div><div>放銃</div></div>`+[...o.players].sort((a,b)=>a.rank-b.rank).map(p=>{let st=o.stats[p.name]||{};return`<div class="tr data"><div class="pos">${p.rank}</div>${band(p.team,p.name)}${band(p.team,p.team)}<div class="num">${Math.round(p.score).toLocaleString()}</div><div class="num">${p.point>0?'+':''}${p.point.toFixed(1)}</div><div class="num">${st.riichi??'—'}</div><div class="num">${st.agari??'—'}</div><div class="num">${st.houju??'—'}</div></div>`}).join('')}
async function load(){status.textContent='● 更新中';try{let [m,h,s]=await Promise.all(['match','hand','set'].map(async k=>objs(csv(await(await fetch(URL(k),{cache:'no-store'})).text()))));D=build(m,h,s);renderTeams();renderInd();renderMatch();let q=new Date;status.textContent=`● LIVE ${String(q.getHours()).padStart(2,'0')}:${String(q.getMinutes()).padStart(2,'0')}`;note.textContent='データ元：Google Sheets（60秒ごとに自動更新）'}catch(e){console.error(e);status.textContent='● 更新失敗';status.style.color='#ff8a8a'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));document.getElementById(b.dataset.p).classList.remove('hide')});sec.innerHTML=Array.from({length:28},(_,i)=>`<option value="${i+1}">第${i+1}節</option>`).join('');metric.onchange=renderInd;[sec,tbl,mno].forEach(x=>x.onchange=renderMatch);refresh.onclick=load;load();setInterval(load,60000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=13').catch(console.error));}
