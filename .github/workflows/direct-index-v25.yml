name: Direct index v25 fix

on:
  push:
    paths:
      - '.github/workflows/direct-index-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Make the v24 layout/stats code part of the real page instead of relying on SW HTML rewriting.
          for v in (21,22,23,24):
              s = s.replace(f'<script src="./individual-stats-v{v}.js?v={v}"></script>', '')
          s = s.replace("navigator.serviceWorker.register('./sw.js?v=14')", "navigator.serviceWorker.register('./sw.js?v=25')")
          if 'individual-stats-v24.js?v=25' not in s:
              s = s.replace('</body>', '<script src="./individual-stats-v24.js?v=25"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Load v24 stats/layout directly from index"
            git push
          fi
